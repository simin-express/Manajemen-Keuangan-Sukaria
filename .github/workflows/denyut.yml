name: Denyut Supabase
# Memanggil database setiap 3 hari agar proyek Supabase gratis tidak dijeda.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions: {}
jobs:
  denyut:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil fungsi ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
